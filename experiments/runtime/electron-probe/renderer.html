<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DesignHub Electron Probe</title>
    <style>
      :root { color-scheme: dark; background: #17181c; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      main { padding: 24px; border: 1px solid #42444d; border-radius: 12px; background: #22242b; }
    </style>
  </head>
  <body>
    <main aria-label="Electron 宿主探针">
      <h1>DesignHub Electron Probe</h1>
      <p>真实 Electron 窗口；不包含应用功能或用户数据。</p>
    </main>
    <script type="module">
      const renderSecurityStatus = async () => {
        const snapshot = await window.desktopProbe.getSecuritySnapshot();
        document.body.dataset.bridge = snapshot.contextIsolation ? 'isolated' : 'unsafe';
      };

      renderSecurityStatus();
    </script>
  </body>
</html>
