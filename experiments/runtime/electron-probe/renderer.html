<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DesignHub Electron Probe</title>
    <style>
      :root { color-scheme: dark; background: #17181c; }
      body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: auto 1fr; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      header { -webkit-app-region: drag; min-height: 44px; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px; background: #17181c; }
      header button { -webkit-app-region: no-drag; }
      main { padding: 24px; border: 1px solid #42444d; border-radius: 12px; background: #22242b; }
    </style>
  </head>
  <body>
    <header data-probe-zone="drag" data-app-region="drag">
      <button type="button" data-probe-zone="no-drag" data-app-region="no-drag">测试无拖动按钮</button>
    </header>
    <main aria-label="Electron 宿主探针" data-solid-fallback="#17181c">
      <h1>DesignHub Electron Probe</h1>
      <p data-material-mode>真实 Electron 窗口；不包含应用功能或用户数据。</p>
    </main>
    <script type="module">
      const renderSecurityStatus = async () => {
        const snapshot = await window.desktopProbe.getSecuritySnapshot();
        document.body.dataset.bridge = snapshot.contextIsolation ? 'isolated' : 'unsafe';
        document.body.dataset.materialMode = snapshot.activeMaterialMode;
        document.querySelector('[data-material-mode]').textContent = snapshot.activeMaterialMode;
      };
      const markNoDragInteraction = () => {
        document.body.dataset.noDragInteraction = 'clicked';
      };

      document.querySelector('[data-probe-zone="no-drag"]').addEventListener('click', markNoDragInteraction);
      renderSecurityStatus();
    </script>
  </body>
</html>
